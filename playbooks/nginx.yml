---
- name: playbook for install nginx on servers
  hosts: testserver01:testserver02:testserver03
  gather_facts: yes
  become: yes
  become_user: root
  vars:
    KOPS_VERSION: '1.2.6'
    KUBECTL_VERSION: '1.2.7'
  tasks:
  - name: check ubuntu os version
    shell: cat /etc/lsb-release | grep -i DISTRIB_DESCRIPTION | cut -d "=" -f2 | tr -d '"'
    register: version
    no_log: true

  - name: show the value of output  
    debug: 
      var: version 
    no_log: true   

  - name: install basic tools
    shell: apt update && apt install -y unzip net-tools 

  - name: install nginx
    apt:
     name: nginx
     state: latest   

  - name: Copy Nginx Index File
    ansible.builtin.copy:
     src: index.html
     dest: /var/www/html/index.nginx-debian.html
     owner: root
     group: root
     mode: u=rw,g=r,o=r

  - name: Copy Nginx JS File
    ansible.builtin.copy:
     src: scorekeeper.js
     dest: /var/www/html/scorekeeper.js
     owner: root
     group: root
     mode: u=rw,g=r,o=r

  - name: Copy Nginx Style File
    ansible.builtin.copy:
     src: style.css
     dest: /var/www/html/style.css
     owner: root
     group: root
     mode: u=rw,g=r,o=r