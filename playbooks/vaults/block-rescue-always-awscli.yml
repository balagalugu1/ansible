---
- hosts: pvtip
  gather_facts: yes
  become: yes
  become_user: root
  tasks:
  - name: Testing The Ansible Blocks
    block:
    - name: Perform apt update
      shell: apt update
    - name: Check if Unzip Exists
      shell: unzip
    - name: Check if jq Exists
      shell: apt install -y jq
    - name: Check if AWS Exists
      shell: aws --version
    when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == '24.04'    

    rescue:
    - name: Install UNZIP
      apt: >
        name=unzip
        state=latest
    - name: Install JQ
      apt: >
        name=jq
        state=latest
    - name: Install AWS
      shell: |
         curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
         unzip awscliv2.zip
         sudo ./aws/install
    when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == '24.04'
    
    always:
    - name: Run This Always
      shell: ls -al
      register: file_list
    - name: Print Files
      debug:
        msg: "{{file_list.stdout}}"
    - name: Check AWS CLI Version
      shell: aws --version